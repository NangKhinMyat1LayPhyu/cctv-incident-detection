<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --ok: #12805c; --warn: #b54708; --bad: #c4320a; --accent: #2558d9; --bar: #7c98e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --panel: #1a1f27; --text: #e7eaf0; --muted: #98a2b3; --line: #2a313c;
            --ok: #32d583; --warn: #fdb022; --bad: #f97066; --accent: #84a9ff; --bar: #5b7bd6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px;
         max-width: 1400px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .shot { position: relative; }
  .cam img { width: 100%; aspect-ratio: 4 / 3; max-height: 320px; object-fit: contain; border-radius: 6px;
             background: #000; display: block; }
  .shot.off img { opacity: .55; }
  .shot .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff;
               font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .cam .row { display: flex; justify-content: space-between; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stats b { color: var(--text); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  .bars div { flex: 1; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 1px; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .event { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .event:first-of-type { border-top: 0; }
  .event img { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--line); }
  .event .title { font-weight: 600; }
  a { color: var(--accent); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=file] { max-width: 100%; color: var(--muted); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 6px; margin: -2px 0 8px; }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 2px 10px; font-size: 12px; }
  .tabs button.on { color: var(--text); border-color: var(--muted); }
  .job { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 8px 0; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Incident Monitor</h1>
  <span id="live" class="pill muted">connecting</span>
  <span id="cycle" class="muted"></span>
</header>
<main>
  <div class="side">
    <section>
      <h2>Cameras</h2>
      <div id="cams" class="cams"><div class="empty">No live cameras. Start <code>incident-recon live ... --out</code> with this folder.</div></div>
    </section>
    <section>
      <h2>Incidents</h2>
      <div class="tabs" id="tabs" hidden>
        <button id="tab-current" class="on">This run</button><button id="tab-all">All runs</button>
      </div>
      <div id="events"><div class="empty">No incidents yet.</div></div>
    </section>
  </div>
  <div class="side">
    <section>
      <h2>Alerts per hour (last 24 h, UTC)</h2>
      <div id="bars" class="bars"></div>
      <div class="axis"><span id="ax0"></span><span>now</span></div>
    </section>
    <section>
      <h2>Analyse a clip</h2>
      <form id="upload">
        <input id="file" type="file" accept=".mp4,.avi,.mov,.mkv" required>
        <button id="send">Upload</button>
      </form>
      <div id="jobs"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const TITLES = {sudden_stop: "Sudden stop", stopped_vehicles: "Stopped vehicles"};
const when = (iso) => { const d = new Date(iso);
  return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false})
    + " · " + d.toLocaleDateString([], {day: "numeric", month: "short"}); };
let runFilter = "current";
const get = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };

async function refreshStatus() {
  try {
    const s = await get("/api/status");
    const pill = $("live");
    pill.textContent = s.live ? "live" : (s.cameras.length ? "stopped" : "no live process");
    pill.className = "pill " + (s.live ? "ok" : "muted");
    $("cycle").textContent = s.live && s.cycle_ms_p95 != null ? `cycle p95 ${s.cycle_ms_p95} ms` : "";
    if (!s.cameras.length) return;
    $("tabs").hidden = !s.run;
    const t = Date.now();
    $("cams").innerHTML = s.cameras.map((c) => {
      const running = s.live && !c.ended;
      const health = !running ? "muted" : c.dropped > 0 || c.reconnects > 0 ? "warn" : "ok";
      // Running: the newest frame. Stopped: the camera's main view, not whatever it showed last.
      const src = running ? c.latest_jpg : (c.main_jpg || c.latest_jpg);
      const tag = running ? (c.on_main_view ? "" : "camera moved off its main view")
                          : `stopped · main view, last update ${when(s.updated_utc)}`;
      const speed = running ? `${c.processed_fps ?? "-"} fps <span class="muted">(stream ${c.stream_fps})</span>` : "ended";
      return `<div class="cam">
        <div class="shot ${running ? "" : "off"}">
          ${src ? `<img alt="Frame from ${esc(c.name)}" src="/live/${esc(src)}?t=${t}">` : "<img alt=''>"}
          ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</div>
        <div class="row"><b>${esc(c.name)}</b><span class="${health}">${speed}</span></div>
        <div class="stats"><span>alerts <b>${c.alerts}</b></span><span>dropped <b>${c.dropped}</b></span>
          <span>reconnects <b>${c.reconnects}</b></span><span>camera moves <b>${c.camera_moves}</b></span></div>
      </div>`;
    }).join("");
  } catch { $("live").textContent = "service unreachable"; $("live").className = "pill bad"; }
}

async function refreshEvents() {
  try {
    const ev = await get(`/api/events?limit=30&run=${runFilter}`);
    $("events").innerHTML = !ev.length ? `<div class="empty">No incidents${runFilter === "current" ? " in this run" : ""} yet.</div>`
      : ev.map((e) => `<div class="event">
      <a href="/live/${esc(e.clip)}"><img alt="Key frame" loading="lazy" src="/live/${esc(e.key_frame)}"></a>
      <div><div class="title">${esc(TITLES[e.type] || e.type)} <span class="muted">· ${esc(e.camera)}</span></div>
        <div class="muted">${esc(when(e.alert_utc))} · at ${e.event_stream_s} s of the stream</div>
        <div>${esc(e.detail)}</div>
        <a href="/live/${esc(e.clip)}">clip</a></div></div>`).join("");
    const hours = await get("/api/events/hourly");
    const max = Math.max(1, ...hours.map((h) => h.alerts));
    $("bars").innerHTML = hours.map((h) =>
      `<div title="${esc(h.hour_utc)}: ${h.alerts}" style="height:${(h.alerts / max) * 100}%"></div>`).join("");
    $("ax0").textContent = hours[0].hour_utc.slice(11, 16);
  } catch {}
}

async function refreshJobs() {
  try {
    const jobs = await get("/api/jobs");
    $("jobs").innerHTML = jobs.slice(0, 8).map((j) => {
      const cls = {done: "ok", failed: "bad"}[j.status] || "warn";
      let body = "";
      if (j.status === "done") {
        const r = j.result;
        body = r.events.length
          ? r.events.map((e) => `<div>${esc(TITLES[e.type] || e.type)} at ${e.time_s} s: ${esc(e.detail)}</div>`).join("")
          : "<div class='muted'>No incident detected.</div>";
        body += `<div><a href="/jobs/${j.id}/${esc(r.report)}">report</a> · <a href="/jobs/${j.id}/${esc(r.video)}">video</a>`
             + r.key_frames.map((k, i) => ` · <a href="/jobs/${j.id}/${esc(k)}">key frame ${i + 1}</a>`).join("") + "</div>";
      } else if (j.status === "failed") body = `<div class="bad">${esc(j.error)}</div>`;
      return `<div class="job"><b>${esc(j.filename)}</b> <span class="${cls}">${esc(j.status)}</span>${body}</div>`;
    }).join("");
  } catch {}
}

for (const [id, value] of [["tab-current", "current"], ["tab-all", "all"]]) {
  $(id).addEventListener("click", () => {
    runFilter = value;
    $("tab-current").classList.toggle("on", value === "current");
    $("tab-all").classList.toggle("on", value === "all");
    refreshEvents();
  });
}

$("upload").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = $("file").files[0]; if (!f) return;
  $("send").disabled = true;
  const body = new FormData(); body.append("file", f);
  try {
    const r = await fetch("/api/analyze", {method: "POST", body});
    if (!r.ok) alert((await r.json()).detail || r.status);
    $("file").value = "";
  } finally { $("send").disabled = false; refreshJobs(); }
});

const tick = () => { refreshStatus(); refreshEvents(); refreshJobs(); };
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
