[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-recon"
version = "0.1.0"
description = "Traffic incident detection from CCTV: YOLO + ByteTrack, calibration-free crash cues, live multi-camera alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.3.*",
    "opencv-python-headless",
    "lap",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
export = ["onnx", "onnxruntime", "onnxslim", "coremltools", "scikit-learn"]
service = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
incident-recon = "incident_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_recon = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]   # zip(strict=) would change runtime behaviour; lengths are equal by construction
